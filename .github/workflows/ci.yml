name: unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
      - uses: actions/cache@v4
        with:
          path: polyworld/.deps
          key: ${{ runner.os }}-generals-deps-${{ hashFiles('polyworld/dependencies.lock') }}
      - name: Fetch pinned dependencies
        run: sh polyworld/tools/fetch_deps.sh
      - name: Check rules, views, messages, and command-line options
        working-directory: polyworld
        run: |
          nim r -d:release tests/test_rules.nim
          nim r -d:release tests/test_povs.nim
          nim r -d:release tests/test_messages.nim
          nim r -d:release tests/test_options.nim
